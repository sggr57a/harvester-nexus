# Default cockpit administrator identity — created on first boot.
#
# Credentials are NOT shipped here. `cockpit_auth.ensure_credential_store`
# generates a random password into /etc/nexus/cockpit-password (mode 0600)
# and a PBKDF2 hash into /etc/nexus/cockpit-auth.json. Demo-mode SPA
# admin/admin lives only in the browser (`src/lib/auth.ts`) and is not
# this install-node path.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin
  namespace: nexus-system
  annotations:
    nexus.io/created-by: installer
    nexus.io/password-change-required: "true"
automountServiceAccountToken: false
---
# Cluster-wide admin role — every Nexus operator inherits this on the
# first boot. Subsequent users created from the cockpit get scoped roles.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nexus-admin
  annotations:
    nexus.io/created-by: installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: admin
    namespace: nexus-system
