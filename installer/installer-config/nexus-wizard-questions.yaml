# Extra install-wizard questions injected into the Harvester installer.
# Layered after the base Harvester wizard's question set so the operator
# answers Harvester's mandatory questions (mode / network / VIP / NTP /
# token / password) first, then sees the Nexus-specific questions below.
#
# Schema mirrors harvester-installer's question definitions
# (https://github.com/harvester/harvester-installer/tree/master/pkg/console).

questions:
  - variable: nexus.admin.username
    label: Cockpit admin username
    description: |
      Username for the built-in Nexus cockpit administrator. Defaults to
      `admin`. The cockpit forces this user to pick a new password on
      first login regardless of the value chosen here.
    type: input
    default: admin
    required: true
    validation: nonempty

  - variable: nexus.admin.initialPasswordFile
    label: Generated cockpit password file
    description: |
      Host-local file where first-boot writes a random cockpit password
      (mode 0600). There is no shipped `admin`/`admin` on installed nodes.
      The first-login flow then forces a password change. Demo-mode SPA
      auth is separate and not used on a real install.
    type: input
    default: /etc/nexus/cockpit-password
    required: true

  - variable: nexus.cockpit.defaultTheme
    label: Default cockpit theme
    description: Pick the default theme applied for every operator on first login.
    type: enum
    default: route-grid
    options:
      - route-grid
      - arctic-hologram
      - arctic-command
      - ice-spectrum

  - variable: nexus.launchVariant
    label: Login launch animation
    description: Which post-login launch animation plays after a successful sign-in.
    type: enum
    default: concentric-boot
    options:
      - concentric-boot
      - status-cascade
      - hex-grid
      - radar-sweep

  - variable: nexus.storage.defaultBackend
    label: Default storage backend
    description: |
      The storage backend that becomes the cluster's default StorageClass.
      Longhorn / local / NFS / iSCSI are live Harvester paths. AnyRAID is
      experimental (`local-path`). Vitastor and Portworx are scaffold
      (generators/UI only). Only the selected backend is provisioned on
      first boot; others can be enabled later from the cockpit.
    type: enum
    default: longhorn
    options:
      - longhorn
      - ceph
      - vitastor
      - anyraid
      - nvme-of
      - rdma
      - zfs
      - iscsi
      - nfs
      - smb
      - glusterfs
      - openebs
      - portworx
      - local

  - variable: nexus.storage.anyraid.enabled
    label: Enable AnyRAID (experimental)
    description: |
      Slab-based RAID planner over heterogeneous-capacity drives. Installs
      StorageClass `anyraid-default` with provisioner `rancher.io/local-path`
      (not `anyraid.csi.nexus.io`). Default is off; enable from the cockpit
      later if you skip it here. See docs/FEATURE_MATURITY.md.
    type: bool
    default: false

  - variable: nexus.polyCompute.kubevirt.enabled
    label: Enable KubeVirt (VMs)
    description: Run virtual machines alongside containers via KubeVirt + virt-handler.
    type: bool
    default: true

  - variable: nexus.polyCompute.incusLxc.enabled
    label: Enable Incus / LXC system containers (scaffold)
    description: |
      Keep Incus/LXC wizard + manifest generators. There is no Incus
      controller on Harvester; this is scaffolding for additional work,
      not a first-boot runtime.
    type: bool
    default: true

  - variable: nexus.acceleration.spdk
    label: Enable SPDK userspace I/O
    description: |
      Bind storage I/O to SPDK userspace queues for NVMe-oF target
      offload. Requires hugepages.
    type: bool
    default: false

  - variable: nexus.acceleration.gpuPassthrough
    label: Enable GPU pass-through (vfio-pci) (waiting-for-hardware)
    description: |
      Bind selected GPUs to vfio-pci so VMs can claim them directly.
      Requires IOMMU (VT-d / AMD-Vi) and the physical card.
    type: bool
    default: false

  - variable: nexus.xdr.enabled
    label: Enable built-in XDR / MDR platform (experimental)
    description: |
      First-boot applies the hardened FOSS subset in
      manifests/20-xdr-stack.yaml (Falco, Tetragon, Wazuh, Suricata,
      Hubble, Trivy, OpenSearch, Polaris, kube-bench, Grype, Syft).
      The 17-sensor Maximum catalog, extra response actions, and
      Incus snapshots are scaffold. Tune later from Security Posture.
    type: bool
    default: true

  - variable: nexus.xdr.profile
    label: XDR security profile
    description: |
      `baseline` and `hardened` map to the applied first-boot subset
      (hardened is the ISO default). `maximum` is the full 17-sensor
      catalog (scaffold) — not all 17 deploy on every install.
    type: enum
    default: hardened
    options: [baseline, hardened, maximum]
    showIf: nexus.xdr.enabled = true

  - variable: nexus.xdr.autoResponse.enabled
    label: Enable automated XDR responses
    description: |
      When enabled, critical alerts can emit Kubernetes YAML (Cilium
      isolate, KubeVirt snapshot, ArgoCD rollback, C2 egress block).
      Incus snapshot responses are scaffold. Disabling leaves the
      engine in alert-only mode.
    type: bool
    default: true
    showIf: nexus.xdr.enabled = true

  - variable: nexus.gitops.enabled
    label: Enable GitOps
    description: |
      Install ArgoCD (default), Flux, or Jenkins-X on first boot so the
      cluster reconciles from a Git repository immediately.
    type: bool
    default: true

  - variable: nexus.gitops.controller
    label: GitOps controller
    description: Pick the controller installed when GitOps is enabled.
    type: enum
    default: argocd
    options: [argocd, flux, jenkins-x]
    showIf: nexus.gitops.enabled = true

  - variable: nexus.compliance.enabled
    label: Enable compliance scans
    description: |
      kube-bench ships in the hardened XDR stack (daily CronJob).
      OpenSCAP and Lynis remain scaffold catalog entries unless you
      apply extra manifests. Drives Compliance Posture rings when data exists.
    type: bool
    default: true

  - variable: nexus.memoryTiering.enabled
    label: Enable memory tiering
    description: |
      Use Linux NUMA demotion/promotion for CXL and persistent memory
      when those devices exist. NVMe is a last-resort zswap+swap tier,
      not extra guest RAM. Future knobs (HBM, DAMON, CXL pooling) wait
      until the kernel exposes them.
    type: bool
    default: true

  - variable: nexus.memoryTiering.policy
    label: Memory tiering policy
    description: |
      capacity = keep the hot working set in DRAM (demote cold pages).
      bandwidth = weighted-interleave across DRAM and CXL without moving
      pages after allocation.
    type: enum
    default: capacity
    options: [capacity, bandwidth]
    showIf: nexus.memoryTiering.enabled = true

  - variable: nexus.observability.prometheus.enabled
    label: Enable Prometheus + alerting
    description: Install the kube-prometheus stack on first boot.
    type: bool
    default: true

  - variable: nexus.observability.logs.enabled
    label: Enable centralized logging
    description: |
      Install a logging stack on first boot. Choose between Loki
      (default), Fluentd, or a Splunk forwarder in the cockpit's
      Operations view later.
    type: bool
    default: true
