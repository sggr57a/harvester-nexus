name: Build install ISO

on:
  push:
    branches:
      - main
      - 'cursor/**'
  workflow_dispatch:

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  DOCKER_BUILDKIT: '0'
  DOCKER_API_VERSION: '1.44'

jobs:
  validate:
    name: Validate cockpit + installer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Stage installer overlay
        run: |
          cd installer
          make overlay

      - name: Run install simulator
        run: |
          cd installer
          make simulate

  build-iso:
    name: Build bootable ISO
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Expand Docker + ISO build storage (~60 GB LVM volume).
      - name: Maximize Docker disk space
        uses: easimon/maximize-build-space@v10
        with:
          build-mount-path: /var/lib/docker
          root-reserve-mb: 512
          temp-reserve-mb: 100
          swap-size-mb: 4096
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Restart Docker
        run: sudo service docker restart

      - name: Prepare build directories on expanded volume
        run: |
          set -euo pipefail
          BUILD_ROOT=/var/lib/docker/nexus-ci
          sudo mkdir -p "${BUILD_ROOT}/build" "${BUILD_ROOT}/dist"
          sudo chown -R "$(id -u):$(id -g)" "${BUILD_ROOT}"
          echo "BUILD_DIR=${BUILD_ROOT}/build" >> "$GITHUB_ENV"
          echo "DIST_DIR=${BUILD_ROOT}/dist" >> "$GITHUB_ENV"
          rm -rf "${GITHUB_WORKSPACE}/build" "${GITHUB_WORKSPACE}/dist"
          ln -sfn "${BUILD_ROOT}/build" "${GITHUB_WORKSPACE}/build"
          ln -sfn "${BUILD_ROOT}/dist" "${GITHUB_WORKSPACE}/dist"
          echo "Disk layout:"
          df -h / /var/lib/docker "${BUILD_ROOT}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve ISO version
        id: version
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test -f installer/VERSION
          VERSION=$(installer/ci-version.sh)
          echo "nexus_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ISO version: ${VERSION}"
          ls -la installer/ci-version.sh installer/VERSION

      - name: Resolve release metadata
        id: release
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          SLUG=$(printf '%s' "${BRANCH}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
          if [[ "${BRANCH}" == "main" ]]; then
            echo "tag=iso-main-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "name=Main ISO build #${GITHUB_RUN_NUMBER} (${{ steps.version.outputs.nexus_version }})" >> "$GITHUB_OUTPUT"
            echo "update_latest=true" >> "$GITHUB_OUTPUT"
            echo "branch_label=main" >> "$GITHUB_OUTPUT"
          else
            echo "tag=iso-${SLUG}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "name=Branch ISO ${BRANCH} #${GITHUB_RUN_NUMBER} (${{ steps.version.outputs.nexus_version }})" >> "$GITHUB_OUTPUT"
            echo "update_latest=false" >> "$GITHUB_OUTPUT"
            echo "branch_label=${BRANCH}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build iso-builder image
        run: |
          cd installer
          make iso-builder
          docker image prune -f

      - name: Show disk before ISO build
        run: df -h / /var/lib/docker "${BUILD_DIR}" "${DIST_DIR}"

      - name: Build ISO
        env:
          BUILD_VERSION: ${{ steps.version.outputs.nexus_version }}
          BUILD_DIR: ${{ env.BUILD_DIR }}
          DIST: ${{ env.DIST_DIR }}
        run: |
          cd installer
          make iso-only BUILD_VERSION="${BUILD_VERSION}" BUILD_DIR="${BUILD_DIR}" DIST="${DIST}"
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          cp -a "${DIST_DIR}/." "${GITHUB_WORKSPACE}/dist/"

      - name: List artifacts
        run: |
          ls -lh dist/
          sha256sum dist/*.iso | tee dist/BUILD-MANIFEST.txt
          echo "commit=${{ github.sha }}" >> dist/BUILD-MANIFEST.txt
          echo "run=${{ github.run_number }}" >> dist/BUILD-MANIFEST.txt
          echo "branch=${{ steps.release.outputs.branch_label }}" >> dist/BUILD-MANIFEST.txt
          echo "version=${{ steps.version.outputs.nexus_version }}" >> dist/BUILD-MANIFEST.txt

      - name: Compress ISO (GitHub release assets are limited to 2 GiB)
        id: compress
        run: |
          ISO=$(ls dist/harvester-nexus-*.iso | head -1)
          SIZE=$(stat -c%s "$ISO")
          echo "iso_path=${ISO}" >> "$GITHUB_OUTPUT"
          echo "iso_size=${SIZE}" >> "$GITHUB_OUTPUT"
          LIMIT=$((2 * 1024 * 1024 * 1024 - 64 * 1024 * 1024))
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "needs_compress=true" >> "$GITHUB_OUTPUT"
            zstd -T0 -19 -f "$ISO" -o "${ISO}.zst"
            sha256sum "${ISO}.zst" > "${ISO}.zst.sha256"
          else
            echo "needs_compress=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release assets
        id: assets
        run: |
          mkdir -p release-assets
          cp dist/BUILD-MANIFEST.txt release-assets/
          cp dist/*.iso.sha256 release-assets/
          ISO=$(ls dist/harvester-nexus-*.iso | head -1)
          ISO_BASENAME=$(basename "$ISO")
          echo "iso_basename=${ISO_BASENAME}" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.compress.outputs.needs_compress }}" = "true" ]; then
            ZST_BASENAME="${ISO_BASENAME}.zst"
            cp "${ISO}.zst" "release-assets/${ZST_BASENAME}"
            cp "${ISO}.zst.sha256" "release-assets/${ZST_BASENAME}.sha256"
            echo "download_name=${ZST_BASENAME}" >> "$GITHUB_OUTPUT"
            echo "download_kind=zst" >> "$GITHUB_OUTPUT"
          else
            cp "$ISO" release-assets/
            echo "download_name=${ISO_BASENAME}" >> "$GITHUB_OUTPUT"
            echo "download_kind=iso" >> "$GITHUB_OUTPUT"
          fi
          ls -lh release-assets/

      - name: Upload ISO workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: harvester-nexus-iso-${{ steps.version.outputs.nexus_version }}
          path: release-assets/*
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          prerelease: true
          generate_release_notes: true
          body: |
            Automated ISO build from [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) on `${{ steps.release.outputs.branch_label }}`.

            **Version:** `${{ steps.version.outputs.nexus_version }}`

            Includes the unified Harvester + Nexus cockpit (Harvester native controls with Nexus theming).

            ## Download

            File: **`${{ steps.assets.outputs.download_name }}`** (+ matching `.sha256`).

            If the download is `.iso.zst`, decompress before booting: `zstd -d ${{ steps.assets.outputs.download_name }}`

            ## Test in a KVM VM (Ubuntu host)

            ```bash
            qemu-img create -f qcow2 harvester-nexus.qcow2 200G

            qemu-system-x86_64 \
              -enable-kvm -m 16384 -smp 8 -cpu host \
              -drive file=harvester-nexus.qcow2,if=virtio \
              -cdrom harvester-nexus-*.iso \
              -boot d \
              -netdev user,id=net0,hostfwd=tcp::8443-:8443,hostfwd=tcp::443-:443 \
              -device virtio-net,netdev=net0
            ```

            After install: **https://127.0.0.1:8443** (`admin` / `admin`). Use the **Harvester** sidebar surface for native VM controls.

            Full guide: [docs/TESTING-ISO-VM.md](${{ github.server_url }}/${{ github.repository }}/blob/main/docs/TESTING-ISO-VM.md)
          files: release-assets/*

      - name: Point iso-latest at this build
        if: steps.release.outputs.update_latest == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iso-latest
          name: Latest main ISO (build #${{ github.run_number }})
          prerelease: true
          body: |
            Rolling pointer to the most recent successful ISO build from `main`.

            **Version:** `${{ steps.version.outputs.nexus_version }}`
            **Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            For the numbered release with full VM instructions, see **`iso-main-${{ github.run_number }}`**.
          files: release-assets/*
